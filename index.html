<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Loads Calc</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .left,
        .second {
            flex: 1;
            width: 50%;
            height: 100%;
        }

        .left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .second {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }

        .logo {
            width: 120px;
            height: auto;
        }

        .second h1 {
            margin: 0;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: #420DF2;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            width: 120px;
        }

        .download-btn img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">


        <div class="second">
            <img src="/sources/lglg.png" class="logo" style="pointer-events: none; user-select: none; -webkit-user-drag: none;" alt="Logo">
            <h2>Download Wind Loads Calc v1.0</h2>
            <a href="/file.zip" download class="download-btn" style="-webkit-user-drag: none;">
                <img src="/sources/dwn.png" style="pointer-events: none; user-select: none; -webkit-user-drag: none;" alt="Download">
            </a>
        </div>


        <div class="left">
            <img src="/sources/sv11.jpg" alt="Background">
        </div>
    </div>

</body>
</html>
